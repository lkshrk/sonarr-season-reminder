name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

# Preserve CI evidence for every direct-to-main commit by never cancelling main runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Run tests with coverage
      run: |
        uv run pytest --cov=new_seasons_reminder --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Check code formatting with ruff
      run: |
        uv run ruff format --check .

    - name: Lint with ruff
      run: |
        uv run ruff check .

    - name: Type check with mypy
      run: |
        uv run mypy src/new_seasons_reminder

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        tags: tautulli-new-seasons-reminder:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: [docker]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    # GITHUB_TOKEN cannot bypass the main ruleset; the octo-sts App can.
    - name: Create release push token
      id: release-token
      uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
      with:
        domain: sts.h-cloud.io
        scope: lkshrk
        identity: sonarr-season-reminder-release

    - name: Python Semantic Release
      id: semrel
      uses: python-semantic-release/python-semantic-release@v10
      with:
        github_token: ${{ steps.release-token.outputs.token }}

    - name: Set up Docker Buildx
      if: steps.semrel.outputs.released == 'true'
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      if: steps.semrel.outputs.released == 'true'
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      if: steps.semrel.outputs.released == 'true'
      id: push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.semrel.outputs.tag }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Create h-cloud deployment token
      if: steps.semrel.outputs.released == 'true'
      id: deploy-token
      uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
      with:
        domain: sts.h-cloud.io
        scope: lkshrk
        identity: h-cloud-dispatch

    - name: Deploy released image through h-cloud
      if: steps.semrel.outputs.released == 'true'
      env:
        GH_TOKEN: ${{ steps.deploy-token.outputs.token }}
        IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        TAG: ${{ steps.semrel.outputs.tag }}@${{ steps.push.outputs.digest }}
      run: |
        jq -n --arg image "$IMAGE" --arg tag "$TAG" \
          '{event_type: "image-update", client_payload: {app: "season-reminder", image: $image, tag: $tag}}' \
          | gh api --method POST repos/lkshrk/h-cloud/dispatches --input -
