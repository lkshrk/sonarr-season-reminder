name: Release

on:
  schedule:
    - cron: '0 12 * * 1' # Every Monday at 12:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Skip CI preflight check and release anyway'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify latest CI Pipeline on main succeeded
        if: ${{ !inputs.force }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CONCLUSION=$(gh run list \
            --workflow "CI Pipeline" \
            --branch main \
            --event push \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion')
          echo "Latest CI Pipeline conclusion on main: ${CONCLUSION:-<none>}"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Latest CI Pipeline run on main is '$CONCLUSION' — refusing to release."
            exit 1
          fi

      - name: Python Semantic Release
        id: semrel
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.semrel.outputs.released == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: steps.semrel.outputs.released == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.semrel.outputs.released == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.semrel.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create h-cloud deployment token
        if: steps.semrel.outputs.released == 'true'
        id: deploy-token
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          domain: sts.h-cloud.io
          scope: lkshrk
          identity: h-cloud-dispatch

      - name: Deploy released image through h-cloud
        if: steps.semrel.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ steps.deploy-token.outputs.token }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ steps.semrel.outputs.tag }}@${{ steps.push.outputs.digest }}
        run: |
          jq -n --arg image "$IMAGE" --arg tag "$TAG" \
            '{event_type: "image-update", client_payload: {app: "season-reminder", image: $image, tag: $tag}}' \
            | gh api --method POST repos/lkshrk/h-cloud/dispatches --input -
